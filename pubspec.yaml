name: crisis_map_natural
description: "A Flutter project de catástrofes en ciudad."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0

  # Geolocalización
  geolocator: ^14.1.1

  # SVG
  flutter_svg: ^2.0.7

  # Mapa
  flutter_map: ^8.3.2
  latlong2: ^0.10.1   # alineado con flutter_map ^4.0.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.svg
